<g fill="#0f766e" font-family="system-ui,Segoe UI,sans-serif" font-weight="750">
  <text x="800" y="585" font-size="42">Nu doar „ce știi?”</text>
  <text x="800" y="635" font-size="32" font-weight="600">Ci: ce întrebi, ce verifici, ce alegi și pentru ce răspunzi.</text>
